@if (item) {
  <div
    class="d-flex flex-column flex-sm-row align-items-center align-items-sm-start text-center text-sm-start h-100 w-100"
  >
    <div class="flex-shrink-0 mb-4 mb-sm-0 me-sm-4" style="width: 120px">
      <div
        class="ratio ratio-1x1 rounded-circle overflow-hidden shadow border border-4 border-white"
      >
        <lightgallery
          [settings]="GALLERY_SETTINGS"
          [onBeforeSlide]="onBeforeSlide"
          class="h-100 w-100 d-block"
        >
          <a
            [attr.href]="item.img"
            [attr.data-sub-html]="item.title"
            class="d-block h-100 w-100 position-relative"
          >
            <img
              [ngSrc]="item.img"
              fill
              [alt]="item.title"
              style="object-fit: cover"
            />
          </a>
        </lightgallery>
      </div>
    </div>
    <div class="flex-grow-1">
      <h3 class="h5 font-heading text-primary mb-1">{{ item.title }}</h3>
      <h5
        class="small font-heading text-secondary mb-3"
        [innerHTML]="item.description"
      ></h5>
      <div class="small">
        @for (paragraph of item.paragraphs; track paragraph) {
          <p class="text-justify mb-2 text-muted" [innerHTML]="paragraph"></p>
        }
      </div>
    </div>
  </div>
}
